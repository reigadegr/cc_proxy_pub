[package]
name = "cli_req_refiner"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
my_config = { path = "../crates/config" }
anyhow = "1.0.102"
futures-util = { version = "0.3.32", default-features = false, features = [
  "std",
] }
bytes = "1.11.1"
chrono = "0.4.44"
flate2 = "1.1.9"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = [
  "http1",
  "http2",
  "tls12",
  "aws-lc-rs",
  "webpki-roots",
] }
hyper-util = { version = "0.1.20", features = ["full"] }
mimalloc = { version = "0.1.48", features = ["no_thp", "override"] }
rayon = "1.11.0"
salvo = { version = "0.91.1", default-features = false, features = [
  "server",
  "http1",
  "http2",
  "oapi",
  "affix-state",
  "test",
] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "local-time",
  "env-filter",
] }
