[package]
name = "pga_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.1"
chrono = "0.4.43"
mimalloc = { version = "0.1.48", features = ["no_thp", "override"] }
pingora = { version = "0.7.0", features = ["proxy", "boringssl", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["local-time"] }

[profile.dev]
debug = 0
debug-assertions = true
incremental = true

[profile.release]
overflow-checks = false
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
debug = 0
debug-assertions = false
incremental = false
panic = "abort"
